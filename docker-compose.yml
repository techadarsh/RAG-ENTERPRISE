services:
  # Milvus Standalone
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.3
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # Ollama LLM Service
  ollama:
    container_name: rag-ollama
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Redis Service (Message Queue for Ingestion)
  redis:
    container_name: rag-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Backend Service
  backend:
    container_name: rag-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - upload-data:/app/uploads
    command: >
      uvicorn main:app 
      --host 0.0.0.0 
      --port 8000 
      --timeout-keep-alive 300
    depends_on:
      milvus:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag-network
    restart: unless-stopped

  # Ingestion Worker Service
  ingestion:
    container_name: rag-ingestion
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    environment:
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - COLLECTION_NAME=enterprise_docs
      - EMBEDDING_MODEL=BAAI/bge-base-en
      - EMBEDDING_DIM=768
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    volumes:
      - upload-data:/app/uploads:ro
      - ./data/incoming:/app/data/incoming:ro
      - ./backend/embeddings.py:/app/backend/embeddings.py:ro
      - ./backend/milvus_client.py:/app/backend/milvus_client.py:ro
      - ./ingestion:/app/ingestion:ro
    depends_on:
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag-network
    restart: unless-stopped

  # Auto-Trigger Service (Folder Watcher + S3 Listener + Webhooks)
  trigger:
    container_name: rag-trigger
    build:
      context: ./trigger
      dockerfile: Dockerfile
    environment:
      - ENABLE_FOLDER_WATCHER=${ENABLE_FOLDER_WATCHER:-false}
      - ENABLE_S3_TRIGGER=${ENABLE_S3_TRIGGER:-false}
      - WATCH_DIR=/app/data/incoming
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=documents
      - S3_WATCH_PREFIX=incoming/
      - S3_DOWNLOAD_DIR=/app/data/s3_downloads
    volumes:
      - ./data/incoming:/app/data/incoming
      - s3-downloads:/app/data/s3_downloads
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - rag-network
    restart: unless-stopped
    profiles:
      - trigger  # Optional service - enable with --profile trigger

  # Frontend Service
  frontend:
    container_name: rag-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - rag-network
    restart: unless-stopped

networks:
  rag-network:
    driver: bridge

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  ollama-data:
  redis-data:
  upload-data:
  s3-downloads:
